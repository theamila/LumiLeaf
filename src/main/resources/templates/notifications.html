<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications | LumiLeaf</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #3FA17A;
            --bg-body: radial-gradient(circle at top right, #1e293b, #0f172a);
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            color: var(--text-main);
            padding: 40px;
        }
        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .btn-back {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-back:hover { background: var(--primary-green); color: white; }
        h1 { font-size: 1.7rem; font-weight: 800; margin: 0; }

        .feed-list {
            max-width: 720px;
            margin: 0 auto;
        }
        .feed-item {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .feed-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            color: white;
        }
        .icon-weighing { background: #d97706; }
        .icon-withering { background: #0ea5e9; }
        .icon-rolling { background: #7c3aed; }
        .icon-drying { background: #e11d48; }

        .feed-msg { font-size: 0.92rem; font-weight: 600; line-height: 1.4; }
        .feed-time { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
        }
        .empty-state i { font-size: 2.2rem; opacity: 0.3; margin-bottom: 10px; display: block; }
    </style>
    <div th:replace="~{fragments/pwa-head :: pwaHead}"></div>
</head>
<body>

<div class="top-row">
    <h1><i class="fas fa-bell me-2"></i> Notifications</h1>
    <a th:href="@{/qa_dashboard}" class="btn-back"><i class="fas fa-arrow-left me-2"></i>Dashboard</a>
</div>

<div class="feed-list">
    <div th:if="${#lists.isEmpty(events)}" class="empty-state">
        <i class="fas fa-bell-slash"></i>
        No notifications yet.
    </div>

    <div th:each="event : ${events}" class="feed-item">
        <div class="feed-icon"
             th:classappend="${event.eventType == 'WEIGHING'} ? 'icon-weighing' : (${event.eventType == 'WITHERING'} ? 'icon-withering' : (${event.eventType == 'ROLLING'} ? 'icon-rolling' : 'icon-drying'))">
            <i th:if="${event.eventType == 'WEIGHING'}" class="fas fa-scale-balanced"></i>
            <i th:if="${event.eventType == 'WITHERING'}" class="fas fa-wind"></i>
            <i th:if="${event.eventType == 'ROLLING'}" class="fas fa-arrows-rotate"></i>
            <i th:if="${event.eventType == 'DRYING'}" class="fas fa-fire-burner"></i>
        </div>
        <div>
            <div class="feed-msg" th:text="${event.message}">Message</div>
            <div class="feed-time" th:text="${#temporals.format(event.createdAt, 'dd MMM yyyy, hh:mm a')}">Time</div>
        </div>
    </div>
</div>

</body>
</html>
