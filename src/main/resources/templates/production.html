<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Production Center | LumiLeaf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --primary-green: #409176; --soft-bg: #f4f7f6; }
        body { background-color: var(--soft-bg); font-family: 'Inter', sans-serif; }
        .main-container { padding: 2rem; }
        .table-card { border-radius: 15px; border: none; background: white; overflow: hidden; }

        .lot-badge { background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; }

        .table-danger .lot-badge { background: #ffcdd2 !important; color: #b71c1c !important; }
        .reject-note-icon { color: #d32f2f; cursor: pointer; margin-left: 5px; }

        .search-container { position: relative; width: 350px; }
        .search-container i.fa-search { position: absolute; left: 15px; top: 12px; color: #b2bec3; }
        .btn-clear-search { position: absolute; right: 10px; top: 8px; border: none; background: transparent; color: #d32f2f; display: none; cursor: pointer; }

        .fab-add {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            border-radius: 50%; background: var(--primary-green); color: white;
            border: none; box-shadow: 0 10px 20px rgba(64,145,118,0.3); z-index: 1000;
            transition: all 0.3s ease;
        }
        .fab-add:hover { transform: scale(1.1); background: #357a63; }

        /* Minimalistic Input Design for clean Spreadsheet View */
        .inline-cell-input {
            border: 1px solid transparent; background: transparent;
            text-align: right;
            width: 65px;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            transition: all 0.2s ease;
        }
        .inline-cell-input:hover {
            border-color: #ced4da; background: #fff;
        }
        .inline-cell-input:focus {
            border-color: var(--primary-green); background: #fff;
            box-shadow: 0 0 0 0.2rem rgba(64,145,118,0.25);
            outline: none;
        }
        .inline-saving { background-color: #fff3cd !important; border-color: #ffda6a !important; }
        .inline-success { background-color: #d1e7dd !important; border-color: #a3cfbb !important; }

        /* ── FIX (production.html actions column): the 4 icon buttons used to sit
           directly in a narrow td and wrapped into an uneven 2x2 grid. They are
           now a single dropdown trigger; this just styles/sizes that trigger and
           removes the default Bootstrap caret so it reads as a clean icon button. */
        .actions-column { min-width: 60px; width: 60px; }
        .action-menu-btn {
            width: 34px; height: 34px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .action-menu-btn::after { display: none; } /* remove bootstrap dropdown caret */
        .action-menu-btn:focus { box-shadow: 0 0 0 0.2rem rgba(64,145,118,0.25); }

        @media print {
            .search-container, .fab-add, .nav-buttons, .actions-column, .inline-cell-input { display: none !important; }
            .table { width: 100% !important; font-size: 8pt; border: 1px solid #dee2e6; }
        }
    </style>
    <div th:replace="~{fragments/pwa-head :: pwaHead}"></div>
</head>
<body>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-center mb-4 nav-buttons">
        <div class="d-flex gap-2">
            <a href="/qa_dashboard" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="fas fa-arrow-left me-2"></i> Dashboard
            </a>
            <button onclick="exportToExcel()" class="btn btn-success rounded-pill px-4">
                <i class="fas fa-file-excel me-2"></i> Export Excel
            </button>
            <button onclick="window.print()" class="btn btn-dark rounded-pill px-4">
                <i class="fas fa-print me-2"></i> Print
            </button>
            <button class="btn btn-primary rounded-pill px-4" onclick="consolidateBatches()">
                <i class="fas fa-layer-group me-2"></i> Send to Stock Production
            </button>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="tableSearch" class="form-control ps-5 border-0 shadow-sm" placeholder="Search Lot # or Date..." style="border-radius: 10px; height: 40px;">
            <button id="clearSearch" class="btn-clear-search"><i class="fas fa-times-circle"></i></button>
        </div>
    </div>

    <div class="card table-card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="productionTable">
                <thead class="table-light">
                <tr>
                    <th><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
                    <th>Green Leaf Arrived Date</th>
                    <th>Rolling Date</th>
                    <th>Lot #</th>
                    <th>Leaf</th>
                    <th>Actual</th>
                    <th>OP1</th><th>OPA</th><th>BOP1</th><th>PEKOE</th>
                    <th>BOP</th><th>BOPF</th><th>EB</th><th>FFSP</th>
                    <th>FFEXS</th><th>DUST</th><th>BM</th><th>BP</th><th>Refuse</th>
                    <th class="text-end actions-column">Actions</th>
                    <th style="display:none;" class="excel-note-col">Rejection Note</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${batches}" th:classappend="${p.status == 'REJECTED'} ? 'table-danger' : ''" th:id="'row-' + ${p.id}">
                    <td><input type="checkbox" class="batch-checkbox" th:value="${p.id}"></td>
                    <!-- ✅ FIX #3: Format production date properly with yyyy-MM-dd format -->
                    <!-- ✅ FIX #4: Show earliest weighing date (Green Leaf Arrived Date) from CSV, not approval date -->
                    <!-- ✅ FIX #8: Show the actual CSV date (transactionDate), not approval date (productionDate) -->
                    <td th:text="${#temporals.format(p.transactionDate != null ? p.transactionDate : p.productionDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${#temporals.format(p.rollingDate, 'yyyy-MM-dd')}"></td>
                    <td>
                        <span class="lot-badge" th:text="${p.lotNumber != null ? p.lotNumber.split('\\s*\\+\\s*')[0] : ''}"></span>
                        <i th:if="${p.status == 'REJECTED'}" class="fas fa-exclamation-circle reject-note-icon" th:title="${p.rejectNote}"></i>
                    </td>
                    <td th:text="${p.greenLeavesQty}"></td>

                    <td class="fw-bold actual-made-total-cell" th:text="${p.actualMadeTea}"></td>

                    <td><input type="number" step="0.1" th:value="${p.op1}" th:data-id="${p.id}" data-field="OP1" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.opa}" th:data-id="${p.id}" data-field="OPA" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.bop1}" th:data-id="${p.id}" data-field="BOP1" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.pekoe}" th:data-id="${p.id}" data-field="PEKOE" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.bop}" th:data-id="${p.id}" data-field="BOP" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.bopf}" th:data-id="${p.id}" data-field="BOPF" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.eb}" th:data-id="${p.id}" data-field="EB" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.ffsp}" th:data-id="${p.id}" data-field="FFSP" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.ffexs}" th:data-id="${p.id}" data-field="FFEXS" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.dust}" th:data-id="${p.id}" data-field="DUST" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.bm}" th:data-id="${p.id}" data-field="BM" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.bp}" th:data-id="${p.id}" data-field="BP" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>
                    <td><input type="number" step="0.1" th:value="${p.refusedTea}" th:data-id="${p.id}" data-field="REFUSE" onchange="saveInlineValue(this)" onfocus="this.select()" class="inline-cell-input"></td>

                    <td class="text-end actions-column">
                        <div class="dropdown">
                            <button class="btn btn-sm btn-light border action-menu-btn" type="button"
                                    data-bs-toggle="dropdown" data-bs-boundary="viewport" aria-expanded="false" title="Actions">
                                <i class="fas fa-ellipsis-vertical"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                <li>
                                    <a class="dropdown-item" href="#" th:attr="onclick=|showFarmerContribution('${p.id}', '${p.lotNumber != null ? p.lotNumber.split('\\s*\\+\\s*')[0] : ''}')|"> <i class="fas fa-users me-2 text-info"></i>Farmer Contribution </a>
                                </li>
                                <li th:if="${p.status != 'REJECTED'}">
                                    <a class="dropdown-item reject-btn" href="#"
                                       th:attr="data-id=${p.id}, data-lot=${p.lotNumber}">
                                        <i class="fas fa-ban me-2 text-danger"></i>Reject Batch
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#"
                                       th:attr="onclick=|openEditModal('${p.id}', '${#temporals.format(p.productionDate, 'yyyy-MM-dd')}', '${p.lotNumber}', '${p.greenLeavesQty}', '${p.actualMadeTea}', '${p.op1}', '${p.opa}', '${p.bop1}', '${p.pekoe}', '${p.bop}', '${p.bopf}', '${p.eb}', '${p.ffsp}', '${p.ffexs}', '${p.dust}', '${p.bm}', '${p.bp}', '${p.refusedTea}')|">
                                        <i class="fas fa-edit me-2 text-primary"></i>Edit
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <a class="dropdown-item text-danger" href="#"
                                       th:onclick="'confirmDelete(' + ${p.id} + ')'">
                                        <i class="fas fa-trash me-2"></i>Delete
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </td>
                    <td style="display:none;" class="excel-note-col" th:text="${p.rejectNote != null ? p.rejectNote : ''}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<button class="fab-add" data-bs-toggle="modal" data-bs-target="#entryModal" onclick="clearForm()">
    <i class="fas fa-plus fa-lg"></i>
</button>

<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <form th:action="@{/production/save}" method="post" id="prodForm">
                <input type="hidden" name="id" id="fId">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="fw-bold">Production Entry / Update</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4">
                    <div class="row g-3">
                        <div class="col-md-3"><label class="small fw-bold">Date</label><input type="date" name="productionDate" id="fDate" class="form-control" required></div>
                        <div class="col-md-3"><label class="small fw-bold">Lot Number</label><input type="text" name="lotNumber" id="fLot" class="form-control" required></div>
                        <div class="col-md-3"><label class="small fw-bold">Green Leaf (kg)</label><input type="number" step="0.1" name="greenLeavesQty" id="fGreen" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-3"><label class="small fw-bold">Actual Made (kg)</label><input type="number" step="0.1" name="actualMadeTea" id="fActual" class="form-control" onfocus="this.select()" required></div>

                        <div class="col-12 mt-4"><h6 class="fw-bold text-success border-bottom pb-2">Tea Grades (kg)</h6></div>
                        <div class="col-md-2"><label>OP1</label><input type="number" step="0.1" name="op1" id="fOp1" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>OPA</label><input type="number" step="0.1" name="opa" id="fOpa" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>BOP1</label><input type="number" step="0.1" name="bop1" id="fBop1" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>PEKOE</label><input type="number" step="0.1" name="pekoe" id="fPekoe" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>BOP</label><input type="number" step="0.1" name="bop" id="fBop" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>BOPF</label><input type="number" step="0.1" name="bopf" id="fBopf" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>EB</label><input type="number" step="0.1" name="eb" id="fEb" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>FFSP</label><input type="number" step="0.1" name="ffsp" id="fFfsp" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>FFEXS</label><input type="number" step="0.1" name="ffexs" id="fFfexs" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>DUST</label><input type="number" step="0.1" name="dust" id="fDust" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>BM</label><input type="number" step="0.1" name="bm" id="fBm" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>BP</label><input type="number" step="0.1" name="bp" id="fBp" class="form-control" onfocus="this.select()"></div>
                        <div class="col-md-2"><label>REFUSE</label><input type="number" step="0.1" name="refusedTea" id="fRefuse" class="form-control" onfocus="this.select()"></div>
                    </div>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const searchInput = document.getElementById('tableSearch');
    const clearBtn = document.getElementById('clearSearch');
    const table = document.getElementById('productionTable');

    function toggleAll(source) {
        const checkboxes = document.querySelectorAll('.batch-checkbox');
        checkboxes.forEach(cb => cb.checked = source.checked);
    }
    function showFarmerContribution(batchId, lotNumber) {
    fetch(`/api/production/${batchId}/contributions`)
        .then(res => res.json())
        .then(data => {
            if (!data || data.length === 0) {
                Swal.fire({ icon: 'info', title: `Farmer Contribution — ${lotNumber}`, text: 'No farmer weighing data found for this batch.' });
                return;
            }
            let rows = data.map(f =>
                `<tr>
                    <td style="text-align:left;">${f.supplierId}</td>
                    <td style="text-align:left;">${f.supplierName}</td>
                    <td style="text-align:right;">${f.weightKg.toFixed(2)} kg</td>
                    <td style="text-align:right;">${f.percent.toFixed(2)}%</td>
                </tr>`
            ).join('');
            Swal.fire({
                title: `Farmer Contribution — ${lotNumber}`,
                html: `<div style="max-height: 350px; overflow-y:auto;">
                    <table class="table table-sm table-striped" style="font-size: 0.85rem;">
                        <thead><tr><th style="text-align:left;">Farmer ID</th><th style="text-align:left;">Name</th><th style="text-align:right;">Weight</th><th style="text-align:right;">%</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`,
                width: 500,
                confirmButtonColor: '#409176'
            });
        })
        .catch(() => Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load farmer contribution data.' }));
}

    // ── FIX (production.html actions column): the action icons live inside
    // .table-responsive / .table-card, both of which clip overflow (needed for
    // scroll + rounded corners). That clipping was also cutting off any dropdown
    // menu opened from a row near the bottom/edge of the table. Temporarily relax
    // the clipping only while a dropdown is open, then restore it on close.
    (function enableDropdownOverflowFix() {
        const responsiveEl = document.querySelector('.table-responsive');
        const cardEl = document.querySelector('.table-card');
        document.querySelectorAll('#productionTable .dropdown').forEach(function (dd) {
            dd.addEventListener('show.bs.dropdown', function () {
                if (responsiveEl) responsiveEl.style.overflow = 'visible';
                if (cardEl) cardEl.style.overflow = 'visible';
            });
            dd.addEventListener('hidden.bs.dropdown', function () {
                if (responsiveEl) responsiveEl.style.overflow = 'auto';
                if (cardEl) cardEl.style.overflow = 'hidden';
            });
        });
    })();

    // --- INLINE LIVE SPREADSHEET UPDATE ---
    function saveInlineValue(inputElement) {
        const batchId = inputElement.getAttribute('data-id');
        const fieldName = inputElement.getAttribute('data-field');
        const newValue = parseFloat(inputElement.value) || 0.0;

        // Visual indicator that saving is processing
        inputElement.classList.add('inline-saving');

        const params = new URLSearchParams();
        params.append('id', batchId);
        params.append('field', fieldName);
        params.append('value', newValue);

        fetch('/api/production/update-cell', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        })
        .then(response => {
            if (!response.ok) throw new Error('Validation failed');
            return response.json();
        })
        .then(data => {
            if(data.success) {
                inputElement.classList.remove('inline-saving');
                inputElement.classList.add('inline-success');

                // Fade out green background quickly
                setTimeout(() => inputElement.classList.remove('inline-success'), 800);

                // Instantly update the row's 'Actual' aggregate cell on screen
                const rowElement = document.getElementById('row-' + batchId);
                if (rowElement) {
                    const totalCell = rowElement.querySelector('.actual-made-total-cell');
                    if (totalCell) totalCell.textContent = parseFloat(data.updatedTotal).toFixed(1);
                }
            }
        })
        .catch(error => {
            inputElement.classList.remove('inline-saving');
            Swal.fire({
                icon: 'error',
                title: 'Sync Failed',
                text: 'The sum of grades cannot exceed the Actual Made total capacity limit.'
            });
        });
    }

    // --- 1. SEARCH & CLEAR ---
    searchInput.addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        const rows = table.querySelector('tbody').rows;
        let found = false;
        clearBtn.style.display = filter === "" ? "none" : "block";

        for (let row of rows) {
            row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
            if (row.style.display === "") found = true;
        }

        let msg = document.getElementById('noResultsMsg');
        if (!found && filter !== "") {
            if (!msg) {
                msg = document.createElement('div');
                msg.id = 'noResultsMsg';
                msg.className = 'text-center p-5 text-muted bg-white mt-2 rounded';
                msg.innerHTML = `<i class="fas fa-search-minus fa-2x mb-2 d-block text-danger"></i> No results found.`;
                table.parentNode.appendChild(msg);
            }
        } else if (msg) msg.remove();
    });

    clearBtn.onclick = () => { searchInput.value = ""; searchInput.dispatchEvent(new Event('keyup')); };

    // --- 2. MODAL LOGIC (EDIT/INSERT) ---
    function openEditModal(id, date, lot, green, actual, op1, opa, bop1, pekoe, bop, bopf, eb, ffsp, ffexs, dust, bm, bp, refuse) {
        document.getElementById('fId').value = id;
        document.getElementById('fDate').value = date;
        document.getElementById('fLot').value = lot;
        document.getElementById('fGreen').value = green;
        document.getElementById('fActual').value = actual;
        document.getElementById('fOp1').value = op1;
        document.getElementById('fOpa').value = opa;
        document.getElementById('fBop1').value = bop1;
        document.getElementById('fPekoe').value = pekoe;
        document.getElementById('fBop').value = bop;
        document.getElementById('fBopf').value = bopf;
        document.getElementById('fEb').value = eb;
        document.getElementById('fFfsp').value = ffsp;
        document.getElementById('fFfexs').value = ffexs;
        document.getElementById('fDust').value = dust;
        document.getElementById('fBm').value = bm;
        document.getElementById('fBp').value = bp;
        document.getElementById('fRefuse').value = refuse;
        new bootstrap.Modal(document.getElementById('entryModal')).show();
    }

    function clearForm() {
        document.getElementById('prodForm').reset();
        document.getElementById('fId').value = "";
    }

    // --- SAFE REJECT BATCH LISTENER ---
    document.querySelectorAll('.reject-btn').forEach(button => {
        button.addEventListener('click', function(evt) {
            evt.preventDefault();
            const id = this.getAttribute('data-id');
            const lotNumber = this.getAttribute('data-lot');

            Swal.fire({
                title: `Reject Batch ${lotNumber}?`,
                text: "Please provide a reason for rejecting this batch:",
                input: 'text',
                inputPlaceholder: 'e.g., Burned during drying, Moisture too high...',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d32f2f',
                confirmButtonText: '<i class="fas fa-ban"></i> Reject Batch',
                preConfirm: (note) => {
                    if (!note) { Swal.showValidationMessage('You must provide a reason!'); }
                    return note;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/production/reject';

                    const idInput = document.createElement('input');
                    idInput.type = 'hidden';
                    idInput.name = 'id';
                    idInput.value = id;

                    const noteInput = document.createElement('input');
                    noteInput.type = 'hidden';
                    noteInput.name = 'note';
                    noteInput.value = result.value;

                    form.appendChild(idInput);
                    form.appendChild(noteInput);
                    document.body.appendChild(form);
                    form.submit();
                }
            });
        });
    });

    // --- 3. FORM VALIDATION ---
    document.getElementById('prodForm').addEventListener('submit', function(event) {
        const greenLeaf = parseFloat(document.getElementById('fGreen').value) || 0;
        const actualMade = parseFloat(document.getElementById('fActual').value) || 0;

        if (actualMade > greenLeaf) {
            event.preventDefault();
            Swal.fire({ icon: 'error', title: 'Invalid Weight', text: `Actual Made (${actualMade} kg) cannot be greater than Green Leaf (${greenLeaf} kg).` });
            return;
        }

        const gradeIds = ['fOp1', 'fOpa', 'fBop1', 'fPekoe', 'fBop', 'fBopf', 'fEb', 'fFfsp', 'fFfexs', 'fDust', 'fBm', 'fBp', 'fRefuse'];
        let sumGrades = 0;

        gradeIds.forEach(id => { sumGrades += parseFloat(document.getElementById(id).value) || 0; });

        if (parseFloat(sumGrades.toFixed(2)) > parseFloat(actualMade.toFixed(2))) {
            event.preventDefault();
            Swal.fire({ icon: 'error', title: 'Grades Exceed Total', text: `The sum of all tea grades (${sumGrades.toFixed(2)} kg) cannot be greater than your Actual Made total (${actualMade} kg).` });
            return;
        }
    });

    // --- 4. DELETE CONFIRM ---
    function confirmDelete(id) {
        Swal.fire({
            title: 'Delete Batch?',
            text: "This action cannot be undone!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'Yes, delete it!'
        }).then((result) => {
            if (result.isConfirmed) window.location.href = '/production/delete/' + id;
        });
    }

    // --- 5. EXCEL EXPORT ---
    async function exportToExcel() {
        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet('LumiLeaf Production');

        worksheet.columns = [
            { header: 'QA Status', width: 15 },
            { header: 'Green Leaf Arrived Date', width: 22 },
            { header: 'Rolling Date', width: 15 },
            { header: 'Lot #', width: 18 },
            { header: 'Leaf', width: 10 }, { header: 'Actual', width: 12 },
            { header: 'OP1', width: 8 }, { header: 'OPA', width: 8 }, { header: 'BOP1', width: 8 },
            { header: 'PEKOE', width: 8 }, { header: 'BOP', width: 8 }, { header: 'BOPF', width: 8 },
            { header: 'EB', width: 8 }, { header: 'FFSP', width: 8 }, { header: 'FFEXS', width: 8 },
            { header: 'DUST', width: 8 }, { header: 'BM', width: 8 }, { header: 'BP', width: 8 },
            { header: 'Refuse', width: 8 }, { header: 'Rejection Note', width: 40 }
        ];

        worksheet.getRow(1).font = { bold: true };

        const rows = document.querySelectorAll('#productionTable tbody tr');
        let totals = new Array(20).fill(0);

        rows.forEach(row => {
            if (row.style.display !== "none") {
                const isRejected = row.classList.contains('table-danger');

                const rowData = [];
                rowData.push(isRejected ? 'REJECTED' : 'ACCEPTED');
                rowData.push(row.cells[1].innerText); // Green Leaf Arrived Date
                rowData.push(row.cells[2].innerText); // Rolling Date
                rowData.push(row.querySelector('.lot-badge').innerText); // Lot #

                for (let i = 4; i <= 18; i++) {
                    let val = 0;
                    const cellInput = row.cells[i].querySelector('input');
                    if (cellInput) {
                        val = parseFloat(cellInput.value) || 0.0;
                    } else {
                        val = parseFloat(row.cells[i].innerText) || 0.0;
                    }
                    rowData.push(val);
                    if (!isRejected) totals[i] += val;
                }

                rowData.push(row.querySelector('.excel-note-col').innerText);
                const excelRow = worksheet.addRow(rowData);

                if (isRejected) {
                    excelRow.eachCell((cell) => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFCDD2' } };
                        cell.font = { color: { argb: 'FFB71C1C' }, bold: true };
                    });
                }
            }
        });

        const totalRowData = ['TOTAL (Accepted Only)', '', '', '', ''];
        for(let i = 4; i <= 18; i++) {
            totalRowData.push(totals[i]);
        }

        const totalRow = worksheet.addRow(totalRowData);
        totalRow.font = { bold: true };

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        saveAs(blob, `Production_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function consolidateBatches() {
        let selectedIds = Array.from(document.querySelectorAll('.batch-checkbox:checked'))
                            .map(cb => cb.value);

        if (selectedIds.length === 0) {
            Swal.fire({
                icon: 'warning',
                title: 'No Batches Selected',
                text: 'Please select at least 1 batch to send to Stock Production.'
            });
            return;
        }

        // ✅ FIX: Client-side pre-check — catch batches missing Actual Made Tea before
        // even opening the confirm dialog, using the same rule the server enforces.
        let missingActual = [];
        selectedIds.forEach(id => {
            const row = document.getElementById('row-' + id);
            const actualVal = parseFloat(row.querySelector('.actual-made-total-cell').textContent.trim()) || 0;
            if (actualVal <= 0) missingActual.push(row.querySelector('.lot-badge').textContent.trim());
        });

        if (missingActual.length > 0) {
            Swal.fire({
                icon: 'error',
                title: 'Missing Actual Made Tea',
                text: `These batch(es) need an Actual Made Tea amount first: ${missingActual.join(', ')}`
            });
            return;
        }

        Swal.fire({
            title: 'Send to Stock Production?',
            text: `You are about to consolidate ${selectedIds.length} batch(es) into a new Stock Production lot.`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#409176',
            confirmButtonText: 'Yes, send it'
        }).then((result) => {
            if (!result.isConfirmed) return;

            fetch('/api/production/consolidate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(selectedIds)
            }).then(res => {
                if(res.ok) {
                    window.location.href = '/stock-production';
                } else {
                    // ✅ FIX: Surface the server's actual error message instead of a
                    // generic one, so batch-specific validation failures are visible.
                    res.text().then(msg => Swal.fire('Error', msg || 'Failed to consolidate batches. Please try again.', 'error'));
                }
            });
        });
    }
</script>
