<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Waiting Point Record</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <div th:replace="~{fragments/pwa-head :: pwaHead}"></div>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0"><i class="fas fa-edit me-2"></i> Update Record</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/waiting/update}" th:object="${record}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{waitingOfficer}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Batch ID</label>
                            <input type="text" th:field="*{batchId}" class="form-control" readonly>
                            <small class="text-muted">Batch ID cannot be changed.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Section</label>
                            <input type="text" th:field="*{section}" class="form-control" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Weight (kg)</label>
                            <input type="number" step="0.01" th:field="*{weight}" class="form-control" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success py-2 fw-bold">
                                <i class="fas fa-save me-2"></i> SAVE CHANGES
                            </button>
                            <a th:href="@{/waiting}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
