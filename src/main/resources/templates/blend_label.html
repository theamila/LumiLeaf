<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tea Traceability Label</title>
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 40px; }
        .label-card { border: 2px solid #333; padding: 30px; border-radius: 15px; text-align: center; width: 350px; }
        .logo { color: #409176; font-weight: bold; font-size: 24px; margin-bottom: 10px; }
        .qr-img { margin: 20px 0; border: 1px solid #eee; padding: 10px; }
        .details { font-size: 14px; text-align: left; margin-bottom: 20px; }
        @media print { .print-btn { display: none; } }
    </style>
    <div th:replace="~{fragments/pwa-head :: pwaHead}"></div>
</head>
<body>
<div class="label-card">
    <div class="logo">LUMILEAF TEA</div>
    <div class="details">
        <div><strong>FG Number:</strong> <span th:text="${blend.finishedGoodNumber}"></span></div>
        <div><strong>Grade:</strong> <span th:text="${blend.grade}"></span></div>
        <div><strong>Batch Ref:</strong> <span th:text="${blend.batchNumber}"></span></div>
    </div>

    <img th:src="'data:image/png;base64,' + ${qrCode}" class="qr-img" width="200" />

    <p style="font-size: 12px; color: #666;">Scan for Full Farm-to-Cup History</p>
    <button class="print-btn" onclick="window.print()" style="padding: 10px 20px; background: #409176; color: white; border: none; cursor: pointer;">Print Label</button>
</div>
</body>
</html>
