<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lumi Project Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <style>
        /* Page background: Cover full viewport to enhance glass effect */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
                        url('/login-bg.png') center center / cover no-repeat;
            background-color: #1b3a2b;
            background-attachment: fixed;
        }

        /* Use dynamic viewport-aware height for mobile PWAs */
        .page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            height: 100%;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Glassmorphism Container */
        .login-box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 35px 28px;
            width: 100%;
            max-width: 360px;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 4px;
            color: #0d361e;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        .login-box h4 {
            margin-top: 0;
            margin-bottom: 22px;
            color: #1b4b2e;
            font-weight: 600;
        }

        /* Semi-transparent Glass Inputs */
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 16px;
            color: #1b3a2b;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #3b5748;
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            border-color: #2c7a4b;
            box-shadow: 0 0 10px rgba(44, 122, 75, 0.3);
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #2c7a4b;
            font-size: 18px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #1b4b2e;
        }

        /* Glass-styled Button */
        button {
            width: 100%;
            padding: 12px;
            background: rgba(44, 122, 75, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: rgba(37, 107, 65, 0.95);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .error {
            color: #b71c1c;
            font-size: 14px;
            margin-top: 15px;
            background: rgba(255, 235, 238, 0.85);
            backdrop-filter: blur(4px);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(211, 47, 47, 0.3);
        }

        /* Optional small-screen tweaks */
        @media (max-width: 420px) {
            .login-box {
                padding: 25px 18px;
                border-radius: 14px;
            }
            .login-box h2 { font-size: 20px; }
        }

        /* Samsung One UI style pulsing dots loader */
        .samsung-loader {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .samsung-loader span {
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            animation: samsungPulse 1.2s infinite ease-in-out;
        }

        .samsung-loader span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .samsung-loader span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes samsungPulse {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.35;
            }
            40% {
                transform: scale(1.25);
                opacity: 1;
            }
        }
    </style>
    <div th:replace="~{fragments/pwa-head :: pwaHead}"></div>
</head>

<body>

<div class="page">
    <div class="login-box">
        <h2>Lumbini Tea Valley Ceylon</h2>
        <h4>Lumi Leaf</h4>

        <form th:action="@{/login}" method="post" onsubmit="showLoginSpinner()">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text"
                   name="username"
                   placeholder="Username"
                   autocomplete="off"
                   required>

            <div class="password-container">
                <input type="password"
                       id="passwordField"
                       name="password"
                       placeholder="Password"
                       autocomplete="new-password"
                       required>
                <i class="fas fa-eye toggle-password" id="toggleIcon" onclick="togglePasswordVisibility()" title="Show/Hide Password"></i>
            </div>

            <button type="submit" id="loginBtn">
                <span id="loginBtnText">Login</span>
            </button>

            <p class="error" th:if="${error}" th:text="${error}"></p>
        </form>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordField = document.getElementById("passwordField");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }

    function showLoginSpinner() {
        const btn = document.getElementById("loginBtn");
        const btnText = document.getElementById("loginBtnText");
        btn.disabled = true;
        btnText.innerHTML = '<span class="samsung-loader"><span></span><span></span><span></span></span>Logging in...';
    }
</script>

</body>
</html>
