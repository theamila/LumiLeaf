<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lumi Project Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Page background: use cover so mobile fills the screen; avoid background-attachment:fixed */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                        url('/login-bg.png') center center / cover no-repeat;
            -webkit-background-size: cover;
            background-color: #1b3a2b;
            background-attachment: scroll;
        }

        /* Use dynamic viewport-aware height for mobile PWAs */
        .page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; /* uses dynamic viewport height on mobile */
            height: 100%;
            padding: 15px;
        }

        .login-box {
            background: rgba(255,255,255,0.95);
            padding: 30px 25px;
            width: 100%;
            max-width: 360px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 5px;
            color: #2c7a4b;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #2c7a4b;
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 18px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #2c7a4b;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2c7a4b;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        button:hover {
            background: #256b41;
        }

        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 15px;
            background: #ffebee;
            padding: 8px;
            border-radius: 6px;
        }

        /* Optional small-screen tweaks */
        @media (max-width: 420px) {
            .login-box {
                padding: 22px 16px;
                border-radius: 12px;
            }
            .login-box h2 { font-size: 20px; }
        }
    </style>
    <div th:replace="~{fragments/pwa-head :: pwaHead}"></div>
</head>

<body>

<div class="page">
    <div class="login-box">
        <h2>Lumbini Tea Valley Ceylon </h2>
        <h4>🌿 Lumi Leaf</h4>
        <p class="subtitle">Admin Login</p>

        <form th:action="@{/login}" method="post">
            <input type="text"
                   name="username"
                   placeholder="Username"
                   autocomplete="off"
                   required>

            <div class="password-container">
                <input type="password"
                       id="passwordField"
                       name="password"
                       placeholder="Password"
                       autocomplete="new-password"
                       required>
                <i class="fas fa-eye toggle-password" id="toggleIcon" onclick="togglePasswordVisibility()" title="Show/Hide Password"></i>
            </div>

            <button type="submit">Login</button>

            <p class="error" th:if="${error}" th:text="${error}"></p>
        </form>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordField = document.getElementById("passwordField");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
