
server.address=0.0.0.0
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/lumileaf_system
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.base-url=http://localhost:8080
server.error.include-message=always
server.error.include-stacktrace=always
spring.thymeleaf.cache=false
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=lumi-leaf-blob
logging.level.org.springframework.security=DEBUG
server.servlet.session.timeout=12h
app.setup-key=change-this-to-a-long-random-value-before-deploying
database.admin.url=http://localhost/phpmyadmin/